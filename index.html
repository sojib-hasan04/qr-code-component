<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | QR code component</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <img
          class="card__qr"
          src="./images/image-qr-code.png"
          alt="QR code that links to the Frontend Mentor website"
          width="288"
          height="288"
  >
  <h1 class="card__title">Improve your front-end skills by building projects</h1>
  <p class="card__description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
</main>

<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
  Coded by <a href="https://github.com/sojib-hasan04">Sojib Ahmed</a>.
</footer>
</body>
</html>
